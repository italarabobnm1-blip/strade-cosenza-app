<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Strade Provincia di Cosenza</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d47a1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Strade PC">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--blu:#1565c0;--blu2:#0d47a1;--rosso:#e53935;--verde:#2e7d32;--giallo:#f9a825;--bg:#0f1720;--panel:#16212e;--txt:#e8eef4;--mut:#8ba0b4;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);overflow:hidden}
#map{position:absolute;inset:0;z-index:1}
.leaflet-container{background:#0b1016}
.leaflet-top.leaflet-left{margin-top:56px}

/* Top bar */
#top{position:absolute;top:0;left:0;right:0;z-index:1000;background:linear-gradient(180deg,var(--blu2),var(--blu));
  color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;box-shadow:0 2px 10px rgba(0,0,0,.5)}
#top .logo{width:34px;height:34px;border-radius:8px;background:#fff;color:var(--blu2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:0 0 auto}
#top h1{font-size:15px;margin:0;line-height:1.1;font-weight:700}
#top small{color:#cfe3ff;font-size:11px}

/* Bottom sheet */
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:1000;background:var(--panel);
  border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.5);
  max-height:78vh;display:flex;flex-direction:column;transition:transform .28s ease;transform:translateY(0)}
#sheet.road{max-height:46vh}
#sheet.min{transform:translateY(calc(100% - 116px))}
#grip{padding:8px 0 4px;text-align:center;cursor:pointer;flex:0 0 auto}
#grip .bar{width:44px;height:5px;border-radius:3px;background:#3a4a5c;margin:0 auto}
#sheetHead{padding:2px 16px 10px;flex:0 0 auto}
#sheetHead .row{display:flex;align-items:center;gap:8px}
#backBtn{display:none;background:#24374a;border:none;color:#fff;border-radius:8px;padding:7px 10px;font-size:14px;cursor:pointer}
#title{font-size:16px;font-weight:700;flex:1}
#count{font-size:12px;color:var(--mut)}

/* filters */
#filters{display:flex;gap:7px;overflow-x:auto;padding:8px 16px 4px;flex:0 0 auto;-webkit-overflow-scrolling:touch}
.chip{white-space:nowrap;background:#22323f;border:1px solid #2f4356;color:var(--txt);border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer}
.chip.on{background:var(--blu);border-color:var(--blu);color:#fff;font-weight:600}

#list{overflow-y:auto;padding:6px 12px 20px;flex:1}
.card{background:#1c2937;border:1px solid #263646;border-radius:12px;padding:12px 14px;margin:8px 0;cursor:pointer;display:flex;align-items:center;gap:12px}
.card:active{background:#223243}
.spnum{width:46px;height:46px;flex:0 0 auto;border-radius:10px;background:var(--blu);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;line-height:1}
.spnum b{font-size:17px}.spnum span{font-size:9px;opacity:.85}
.spnum.long b{font-size:12.5px}
.cbody{flex:1;min-width:0}
.cbody .nm{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbody .meta{font-size:11.5px;color:var(--mut);margin-top:3px}
.badge{flex:0 0 auto;background:var(--rosso);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px}
.badge.zero{background:#2c3d2e;color:#8fd694}

/* scheda strada */
.info{font-size:12px;color:#b6c7d6;background:#1c2937;border:1px solid #263646;border-radius:10px;padding:9px 11px;margin:4px 0 6px;line-height:1.5}
.info div+div{margin-top:3px;color:#8ba0b4}
.info .tag{display:inline-block;width:18px;height:0;border-top:4px solid #ff5252;vertical-align:middle;margin-right:6px}
.info .tag.ab{border-top:4px dashed #b0bec5}

/* point rows */
.prow{display:flex;align-items:center;gap:11px;padding:11px 4px;border-bottom:1px solid #22303d}
.dot{width:14px;height:14px;border-radius:50%;flex:0 0 auto;border:2px solid #0008}
.dot.km{background:#42a5f5}.dot.limit{background:var(--giallo)}.dot.issue{background:var(--rosso)}.dot.incrocio{background:#ab47bc}.dot.other{background:#90a4ae}
.pnm{flex:1;font-size:13.5px;min-width:0}
.pnm small{display:block;color:var(--mut);font-size:11px;margin-top:2px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.thumb{width:104px;height:70px;object-fit:cover;border-radius:8px;border:1px solid #2f4356;background:#0b1016;cursor:zoom-in;display:block}
.nav{background:var(--verde);border:none;color:#fff;border-radius:8px;padding:8px 11px;font-size:12.5px;font-weight:600;cursor:pointer;flex:0 0 auto;text-decoration:none}
.stbtn{border:none;border-radius:8px;padding:8px 10px;font-size:12px;font-weight:600;cursor:pointer;flex:0 0 auto}
.st-todo{background:#5a1f1f;color:#ff9a9a}.st-assign{background:#5a4a1f;color:#ffe08a}.st-done{background:#1f5a2a;color:#9af0ab}

/* legend */
#legend{position:absolute;right:10px;top:64px;z-index:900;background:rgba(16,26,36,.86);backdrop-filter:blur(4px);border:1px solid #2a3b4d;border-radius:10px;padding:8px 10px;font-size:11px;color:#cfe0ee}
#legend div{display:flex;align-items:center;gap:6px;margin:3px 0}
#legend .d{width:11px;height:11px;border-radius:50%}
#legend .ln{width:16px;height:0;border-top:4px solid #ff5252}
#legend .ln.ab{border-top:4px dashed #b0bec5}
.leaflet-popup-content-wrapper{background:#1c2937;color:#fff;border-radius:10px}
.leaflet-popup-tip{background:#1c2937}
.pop b{font-size:13px}.pop .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.pop .thumb{width:120px;height:80px}

/* foto a schermo intero */
#photo{display:none;position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.93);flex-direction:column;align-items:center;justify-content:center;padding:14px}
#photo.on{display:flex}
#photo img{max-width:100%;max-height:80vh;border-radius:8px}
#photoCap{color:#e8eef4;font-size:13px;margin-top:12px;text-align:center;max-width:560px}
#photoX{position:absolute;top:12px;right:14px;background:#24374a;border:none;color:#fff;border-radius:999px;width:38px;height:38px;font-size:18px;cursor:pointer}
</style>
</head>
<body>
<div id="map"></div>

<div id="top">
  <div class="logo">PC</div>
  <div style="flex:1">
    <h1>Strade Provinciali</h1>
    <small>Provincia di Cosenza · zona Cassano allo Ionio</small>
  </div>
</div>

<div id="legend">
  <div><span class="d" style="background:#42a5f5"></span> Cippo km</div>
  <div><span class="d" style="background:#f9a825"></span> Inizio/Fine competenza</div>
  <div><span class="d" style="background:#ab47bc"></span> Incrocio / segnaletica</div>
  <div><span class="d" style="background:#e53935"></span> Segnalazione</div>
  <div><span class="ln"></span> Competenza Provincia</div>
  <div><span class="ln ab"></span> Centro abitato (Comune)</div>
</div>

<div id="sheet">
  <div id="grip" onclick="toggleSheet()"><div class="bar"></div></div>
  <div id="sheetHead">
    <div class="row">
      <button id="backBtn" onclick="showList()">‹ Strade</button>
      <div id="title">Elenco strade</div>
      <div id="count"></div>
    </div>
  </div>
  <div id="filters"></div>
  <div id="list"></div>
</div>

<div id="photo" onclick="closePhoto()"><button id="photoX" aria-label="Chiudi">✕</button><img id="photoImg" alt=""><div id="photoCap"></div></div>

let LS = {};
try{LS=JSON.parse(localStorage.getItem('statiSegnalazioni')||'{}');}catch(e){}
function saveLS(){try{localStorage.setItem('statiSegnalazioni',JSON.stringify(LS));}catch(e){}}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtKm=x=>String(x).replace('.',',');

// ---- map ----
const map = L.map('map',{zoomControl:false}).setView([39.55,16.25],9);
L.control.zoom({position:'topleft'}).addTo(map);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  {maxZoom:19,attribution:'Esri World Imagery'}).addTo(map);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
  {maxZoom:19,opacity:.9}).addTo(map);

let layer = L.layerGroup().addTo(map);
const colorFor={km:'#42a5f5',limit:'#f9a825',issue:'#e53935',incrocio:'#ab47bc',other:'#90a4ae'};
const lineOpt=w=>({color:'#ff5252',weight:w,opacity:.9});
const abitOpt=w=>({color:'#b0bec5',weight:w,opacity:.9,dashArray:'6 8'});
// altezza occupata dal pannello in basso: la mappa inquadra il tracciato solo nella parte rimasta libera
function fitPad(){
  const s=$('#sheet');
  const h=s.classList.contains('min')?116:innerHeight*(s.classList.contains('road')?.46:.78);
  return Math.round(h)+16;
}

// chiave stabile per lo stato di un punto: non cambia se i dati vengono rigenerati
function keyOf(r,i){const p=r.points[i];return r.id+'#'+((p&&p.id)||i);}
function statusOf(r,i){return LS[keyOf(r,i)]||{st:'todo',who:''};}

// ---- collegamenti esterni e foto ----
const thumbUrl=h=>'foto/'+h+'_t.jpg', fotoUrl=h=>'foto/'+h+'.jpg';
function navUrl(p){return 'https://www.google.com/maps/dir/?api=1&destination='+p.lat+','+p.lng;}
function mapillaryUrl(p){return 'https://www.mapillary.com/app/?lat='+p.lat+'&lng='+p.lng+'&z=17&focus=map';}
// se nel KML era salvata una vista Street View apre esattamente quella (stesso panorama, direzione e inclinazione)
function svUrl(p){
  const s=p.sv&&p.sv[0];
  if(s)return 'https://www.google.com/maps/@?api=1&map_action=pano&pano='+encodeURIComponent(s.id)+'&viewpoint='+s.lat+','+s.lng+'&heading='+s.h+'&pitch='+s.p;
  return 'https://www.google.com/maps?layer=c&cbll='+p.lat+','+p.lng;
}
function thumbsHtml(r,i,p){
  if(!p.foto||!p.foto.length)return '';
  return '<div class="thumbs">'+p.foto.map((h,k)=>'<img class="thumb" loading="lazy" alt="foto" src="'+thumbUrl(h)+'" onclick="event.stopPropagation();openPhotoOf(\''+r.id+'\','+i+','+k+')" onerror="this.style.display=\'none\'">').join('')+'</div>';
}
const FONTE_FOTO='Immagini da Google Street View © Google, salvo diversa indicazione';
function openPhoto(h,cap){$('#photoImg').src=fotoUrl(h);$('#photoCap').innerHTML=esc(cap||'')+'<div style="margin-top:6px;font-size:11px;color:#8ba0b4">'+FONTE_FOTO+'</div>';$('#photo').classList.add('on');}
function closePhoto(){$('#photo').classList.remove('on');$('#photoImg').removeAttribute('src');}
function openPhotoOf(rid,i,k){const r=ROADS.find(x=>x.id==rid),p=r.points[i];openPhoto(p.foto[k],'S.P. '+r.sp+' · '+p.name+(p.note?' — '+p.note:''));}
document.addEventListener('keydown',e=>{if(e.key=='Escape')closePhoto();});

// ---- disegno sulla mappa ----
function drawRoad(r,fit){
  layer.clearLayers();
  (r.abitato||[]).forEach(ln=>L.polyline(ln,abitOpt(5)).addTo(layer));
  r.lines.forEach(ln=>L.polyline(ln,lineOpt(5)).addTo(layer));
  r.points.forEach((p,i)=>{
    const c=colorFor[p.type]||'#90a4ae';
    const mk=L.circleMarker([p.lat,p.lng],{radius:p.type=='issue'?9:7,color:'#000',weight:2,fillColor:c,fillOpacity:1}).addTo(layer);
    mk.bindPopup(popupHtml(r,p,i),{maxWidth:260});
  });
  if(fit){
    const b=[]; r.lines.concat(r.abitato||[]).forEach(l=>l.forEach(c=>b.push(c))); r.points.forEach(p=>b.push([p.lat,p.lng]));
    if(b.length)map.fitBounds(b,{paddingTopLeft:[30,72],paddingBottomRight:[30,fitPad()]});
  }
}
function drawAll(rs){
  rs=rs||ROADS;
  layer.clearLayers();
  rs.forEach(r=>{
    (r.abitato||[]).forEach(ln=>L.polyline(ln,abitOpt(4)).addTo(layer));
    r.lines.forEach(ln=>L.polyline(ln,lineOpt(4)).addTo(layer).on('click',()=>openRoad(r)));
    r.points.forEach((p,i)=>{
      if(p.type!='issue'&&p.type!='incrocio')return;
      L.circleMarker([p.lat,p.lng],{radius:8,color:'#000',weight:2,fillColor:colorFor[p.type],fillOpacity:1}).addTo(layer).bindPopup(popupHtml(r,p,i),{maxWidth:260});
    });
  });
  const b=[]; rs.forEach(r=>r.lines.forEach(l=>l.forEach(c=>b.push(c))));
  if(b.length)map.fitBounds(b,{paddingTopLeft:[30,72],paddingBottomRight:[30,fitPad()]});
}
function popupHtml(r,p,i){
  let extra='';
  if(p.type=='issue'||p.type=='incrocio'){const s=statusOf(r,i);extra='<div style="margin-top:4px;font-size:11px;color:#ffb3b3">Stato: '+labelSt(s.st)+(s.who?' · '+esc(s.who):'')+'</div>';}
  return '<div class="pop"><b>'+esc(p.name)+'</b><br><small style="color:#9fb4c8">'+esc(r.name)+'</small>'+
    (p.note?'<br><small style="color:#cfe0ee">'+esc(p.note)+'</small>':'')+extra+thumbsHtml(r,i,p)+
    '<div class="acts"><a class="nav" target="_blank" href="'+navUrl(p)+'">🧭 Naviga</a><a class="nav" style="background:#6a1b9a" target="_blank" href="'+mapillaryUrl(p)+'">📷 Mapillary</a><a class="nav" style="background:#fb8c00" target="_blank" href="'+svUrl(p)+'">👁️ Street View</a></div></div>';
}

// ---- UI ----
let curRoad=null, fServ='', fGrp='', fIssue=false;
const $=s=>document.querySelector(s);

function buildFilters(){
  const servs=[...new Set(ROADS.map(r=>r.servizio))].sort();
  const grps=[...new Set(ROADS.map(r=>r.gruppo))].sort((a,b)=>a-b);
  let h='<div class="chip'+(fIssue?' on':'')+'" onclick="tgIssue()">⚠️ Con segnalazioni</div>';
  servs.forEach(s=>h+='<div class="chip'+(fServ==s?' on':'')+'" onclick="setServ(\''+s+'\')">Servizio '+esc(s)+'</div>');
  grps.forEach(g=>h+='<div class="chip'+(fGrp==g?' on':'')+'" onclick="setGrp(\''+g+'\')">Gruppo '+esc(g)+'</div>');
  $('#filters').innerHTML=h;
}
function setServ(s){fServ=fServ==s?'':s;renderList();}
function setGrp(g){fGrp=fGrp==g?'':g;renderList();}
function tgIssue(){fIssue=!fIssue;renderList();}

function issuesOf(r){return r.points.filter(p=>p.type=='issue');}
function renderList(){
  buildFilters();
  let rs=ROADS.filter(r=>(!fServ||r.servizio==fServ)&&(!fGrp||r.gruppo==fGrp)&&(!fIssue||issuesOf(r).length));
  $('#title').textContent='Elenco strade';
  $('#count').textContent=rs.length+' strade';
  $('#backBtn').style.display='none'; $('#sheet').classList.remove('road');
  $('#filters').style.display='flex';
  let h='';
  rs.forEach(r=>{
    const ni=issuesOf(r).length, nf=r.points.reduce((a,p)=>a+(p.foto?p.foto.length:0),0);
    h+='<div class="card" onclick="openRoad(ROADS.find(x=>x.id==\''+r.id+'\'))">'+
      '<div class="spnum'+(r.sp.length>3?' long':'')+'"><b>'+esc(r.sp)+'</b><span>S.P.</span></div>'+
      '<div class="cbody"><div class="nm">Strada Provinciale '+esc(r.sp)+'</div>'+
      '<div class="meta">Servizio '+esc(r.servizio)+' · Gruppo '+esc(r.gruppo)+' · '+fmtKm(r.len_km)+' km'+(nf?' · '+nf+' foto':'')+'</div></div>'+
      '<div class="badge '+(ni?'':'zero')+'">'+(ni?ni+' ⚠️':'ok')+'</div></div>';
  });
  $('#list').innerHTML=h||'<p style="color:#8ba0b4;text-align:center;padding:20px">Nessuna strada con questi filtri.</p>';
  drawAll(rs);
}

function infoHtml(r){
  let a='<div class="info"><div><b>Servizio '+esc(r.servizio)+' · Gruppo '+esc(r.gruppo)+'</b>'+
    (r.km_ini&&r.km_fin?' · km '+esc(r.km_ini)+' → '+esc(r.km_fin):'')+' · tracciato '+fmtKm(r.len_km)+' km'+
    (r.uff&&r.uff.len_m?' (GIS Provincia '+fmtKm((r.uff.len_m/1000).toFixed(2))+' km)':'')+'</div>';
  (r.tratti||[]).forEach(t=>a+='<div><span class="tag'+(t.k=='abitato'?' ab':'')+'"></span>'+esc(t.n)+'</div>');
  if(r.points.some(p=>p.foto&&p.foto.length))a+='<div style="font-size:11px">Foto: '+FONTE_FOTO+'</div>';
  return a+'</div>';
}

function openRoad(r){
  curRoad=r;
  $('#sheet').classList.add('road'); $('#sheet').classList.remove('min');
  drawRoad(r,true);
  $('#title').textContent='S.P. '+r.sp;
  $('#count').textContent=issuesOf(r).length+' segnal.';
  $('#backBtn').style.display='block';
  $('#filters').style.display='none';
  const groups=[['issue','⚠️ Segnalazioni'],['incrocio','🚦 Incroci e segnaletica'],['limit','📍 Inizio / Fine competenza'],['km','🔵 Cippi chilometrici'],['other','• Altro']];
  let h=infoHtml(r);
  groups.forEach(([t,lab])=>{
    const pts=r.points.map((p,i)=>({p,i})).filter(x=>x.p.type==t);
    if(!pts.length)return;
    h+='<div style="font-size:12px;color:#8ba0b4;margin:12px 4px 4px;font-weight:700">'+lab+' ('+pts.length+')</div>';
    pts.forEach(({p,i})=>{
      let ctrl='<a class="nav" target="_blank" href="'+navUrl(p)+'" title="Naviga">🧭</a><a class="nav" style="background:#6a1b9a" target="_blank" href="'+mapillaryUrl(p)+'" title="Foto stradali (Mapillary)">📷</a><a class="nav" style="background:#fb8c00" target="_blank" href="'+svUrl(p)+'" title="Google Street View">👁️</a>';
      const st=(t=='issue'||t=='incrocio')?statusOf(r,i):null;
      if(st)ctrl='<button class="stbtn '+stCls(st.st)+'" onclick="event.stopPropagation();cycleSt(\''+r.id+'\','+i+')">'+labelSt(st.st)+'</button>'+ctrl;
      h+='<div class="prow" onclick="flyTo('+p.lat+','+p.lng+')"><span class="dot '+p.type+'"></span>'+
        '<div class="pnm">'+esc(p.name)+(p.note?'<small>'+esc(p.note)+'</small>':'')+(st&&st.who?'<small>assegnato a: '+esc(st.who)+'</small>':'')+thumbsHtml(r,i,p)+'</div>'+ctrl+'</div>';
    });
  });
  $('#list').innerHTML=h;
  $('#list').scrollTop=0;
}
function showList(){curRoad=null;renderList();$('#sheet').classList.remove('min');}
function flyTo(lat,lng){map.flyTo([lat,lng],17);}

function labelSt(s){return s=='done'?'Fatto':s=='assign'?'Assegnato':'Da fare';}
function stCls(s){return s=='done'?'st-done':s=='assign'?'st-assign':'st-todo';}
function cycleSt(id,i){
  const r=ROADS.find(x=>x.id==id);const k=keyOf(r,i);const cur=(LS[k]||{st:'todo',who:''});
  const order=['todo','assign','done'];let ns=order[(order.indexOf(cur.st)+1)%3];
  let who=cur.who;
  if(ns=='assign'){who=prompt('Assegna a (cantoniere / ditta):',who||'')||'';}
  if(ns=='todo')who='';
  LS[k]={st:ns,who};saveLS();openRoad(r);
}

function toggleSheet(){$('#sheet').classList.toggle('min');}

renderList();

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
